# Skykeep for Windows, proven on Windows before anyone downloads it:
#   1. build — on one machine, in order: the Tauri versions checked (seconds), the whole test
#              suite in release mode with the real Credential Manager, then the .msi and the
#              per-user .exe installer from the same compiled crates. One compile, not two;
#   2. smoke — the .exe installed silently, Skykeep launched, its window seen on screen, and a
#              screenshot kept, so an installer that cannot even start is never handed over;
#              then each app's Start-menu entry and window checked for its own app ID, the jump
#              list's tasks found, and the uninstaller seen to take every entry away;
#   ui       — every interface suite in Edge, only when asked for: Edge is the Chromium engine
#              ci.yml already runs every suite in on each push.
# Run by hand (Actions → Windows build → Run workflow) or by a release (release.yml); never on
# every push.
name: Windows build

on:
  workflow_dispatch:
    inputs:
      test_first:
        description: "Run the whole test suite on Windows before building"
        type: boolean
        default: true
      edge_ui:
        description: "Also run every interface suite in Edge (about 30 minutes)"
        type: boolean
        default: false
  # A release (release.yml) builds Windows through this same, proven pipeline.
  workflow_call:
    inputs:
      test_first:
        type: boolean
        default: true
      edge_ui:
        type: boolean
        default: false
      # A release: the installers signed for the in-app updater, each with its .sig.
      updater:
        type: boolean
        default: false
      # What to build, when not the caller's own commit: a tag, for the Store's package (msix.yml).
      ref:
        type: string
        default: ""
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # `tauri build` refuses a Tauri npm package and Rust crate on different minor versions —
      # checked first, so a mismatch costs seconds, not a whole compile.
      - name: Tauri versions match
        shell: bash
        run: |
          node -e '
            const lock = require("./package-lock.json").packages;
            const npm = lock["node_modules/@tauri-apps/api"].version;
            const rust = require("fs").readFileSync("Cargo.lock", "utf8").match(/name = "tauri"\r?\nversion = "([^"]+)"/)[1];
            const mm = (v) => v.split(".").slice(0, 2).join(".");
            console.log(`@tauri-apps/api ${npm}, tauri crate ${rust}`);
            if (mm(npm) !== mm(rust)) { console.error("Tauri npm package and crate differ: align them"); process.exit(1); }'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-release
      # HEIC decoding: libheif with its default codecs (libde265 decodes), linked in statically,
      # with the C and C++ runtimes too (the x64-windows-static triplet, /MT, matching Rust's
      # crt-static below): skykeep.exe then needs no Visual C++ Redistributable, which a fresh
      # Windows doesn't have — without it the program can't start at all (STATUS_DLL_NOT_FOUND).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\vcpkg\installed
          key: vcpkg-libheif-default-x64-windows-static-v1
      - name: HEIC decoder
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "libheif:x64-windows-static"
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=x64-windows-static" >> $env:GITHUB_ENV
      # The window's files must exist for the app crate to compile.
      - run: npm run build
      # iCloud Drive in File Explorer on this Windows: a cloud folder registered, listed and
      # read by another process, its output shown (whether the shell took the registration).
      - name: iCloud Drive in File Explorer
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=skykeep -C target-feature=+crt-static
        run: cargo test --release -p quince-vfs --test cloud_windows --locked -- --nocapture --test-threads=1
      - name: Tests, on Windows
        if: ${{ inputs.test_first }}
        # In release mode, so the installer build below reuses what this compiled. The probe
        # examples are live tools for Linux (one mounts a FUSE folder), not tests.
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=skykeep -C target-feature=+crt-static
        run: cargo test --release --workspace --lib --bins --tests --locked --no-fail-fast
      - name: Build the installers
        # The build machine's paths are never written into the program. A release also signs
        # the installers for the in-app updater (createUpdaterArtifacts: a .sig beside each);
        # the key is the release's alone, so any other build makes the installers only.
        shell: bash
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=skykeep -C target-feature=+crt-static
          UPDATER: ${{ inputs.updater && 'yes' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.updater && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.updater && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          if [ -n "$UPDATER" ]; then
            if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
              echo "::error::a release needs the TAURI_SIGNING_PRIVATE_KEY secret to sign its updates"
              exit 1
            fi
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
            ls target/release/bundle/nsis/*-setup.exe.sig target/release/bundle/msi/*.msi.sig
          else
            npx tauri build
          fi
      - name: The program needs no Visual C++ Redistributable
        shell: pwsh
        run: |
          # The names of the DLLs a program imports are in it as plain text.
          $exe = "target/release/skykeep.exe"
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe))
          $found = [regex]::Matches($text, '(?i)\b(msvcp1\d\d[_a-z0-9]*|vcruntime1\d\d[_a-z0-9]*|concrt1\d\d)\.dll') |
            ForEach-Object Value | Sort-Object -Unique
          if ($found) { throw "skykeep.exe imports $($found -join ', '): it would not start on a PC without the Visual C++ Redistributable" }
          "skykeep.exe imports no Visual C++ runtime DLL"
      - name: Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem target/release/bundle -Recurse -Include *.msi,*.exe
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content target/release/bundle/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skykeep-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi.sig
            target/release/bundle/nsis/*.exe.sig
            target/release/bundle/SHA256SUMS-windows.txt
          if-no-files-found: error

  # Every interface suite in Microsoft Edge — the engine WebView2 is — with Windows' own fonts,
  # and every screen photographed light and dark, to be looked at.
  ui:
    if: ${{ inputs.edge_ui }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Interface suites, in Edge
        shell: pwsh
        env:
          ENGINE: msedge
        run: |
          $shots = "$PWD\shots"; New-Item -ItemType Directory -Force $shots | Out-Null
          $env:TMPDIR = $shots
          # Node runs vite directly: `npx` is a .cmd script on Windows, which Start-Process cannot
          # launch, and every suite then met a refused connection. Bound to every address, so
          # "localhost" answers whether it resolves to 127.0.0.1 or ::1.
          $preview = Start-Process node -ArgumentList "node_modules/vite/bin/vite.js","preview","--port","4173","--strictPort","--host" -PassThru -WindowStyle Hidden -RedirectStandardOutput "$shots\preview.log" -RedirectStandardError "$shots\preview-err.log"
          $up = $false
          for ($i = 0; $i -lt 60; $i++) { try { Invoke-WebRequest http://localhost:4173 -UseBasicParsing | Out-Null; $up = $true; break } catch { Start-Sleep 1 } }
          if (-not $up) { Get-Content "$shots\preview.log","$shots\preview-err.log" -ErrorAction SilentlyContinue; throw "the preview server did not come up" }
          "preview up"
          node .uiverify/look-all.mjs $shots 1400 850 dark
          node .uiverify/look-all.mjs "$shots" 1400 850 light
          Get-ChildItem $shots -Filter "all-*.png" | ForEach-Object { Rename-Item $_.FullName ($_.Name -replace "^all-", "screen-") -ErrorAction SilentlyContinue }
          $failed = @()
          $suites = Get-ChildItem .uiverify -Filter *.mjs | Where-Object {
            $_.Name -notmatch '^(look|dbg|engine|stub|assert|crash|shots)' -and $_.Name -notmatch '\.test\.mjs$' -and (Select-String -Path $_.FullName -Pattern 'engine.mjs' -Quiet)
          }
          foreach ($t in $suites) {
            node $t.FullName *> "$shots\$($t.BaseName).log"
            if ($LASTEXITCODE -ne 0) { $failed += $t.Name; "FAIL $($t.Name)" } else { "ok   $($t.Name)" }
          }
          Stop-Process -Id $preview.Id -ErrorAction SilentlyContinue
          "$($suites.Count - $failed.Count) of $($suites.Count) suites passed in Edge"
          if ($failed.Count) { $failed | Set-Content "$shots\FAILED.txt"; exit 1 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: skykeep-ui-in-edge
          path: shots
          if-no-files-found: ignore

  smoke:
    needs: build
    # Whenever an installer was built — a quick build included, its tests skipped.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: skykeep-windows
          path: dist
      - name: Install, launch, see the window, the six apps, the jump list, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Recurse -Filter *-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter skykeep.exe | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter skykeep.exe -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $exe) { throw "Skykeep was not installed" }
          "installed at $($exe.FullName)"
          # An app ID as the shell reads it: a window's, or a shortcut file's.
          Add-Type -TypeDefinition '
            using System; using System.Runtime.InteropServices;
            namespace WinShell {
              [StructLayout(LayoutKind.Sequential)] public struct PropKey { public Guid fmtid; public uint pid; }
              [StructLayout(LayoutKind.Sequential)] public struct PropVar { public ushort vt, r1, r2, r3; public IntPtr p, p2; }
              [ComImport, Guid("886D8EEB-8CF2-4446-8D02-CDBA1DBDCF99"), InterfaceType(ComInterfaceType.InterfaceIsIUnknown)]
              public interface IPropertyStore {
                void GetCount(out uint count); void GetAt(uint i, out PropKey key); void GetValue(ref PropKey key, out PropVar v);
                void SetValue(ref PropKey key, ref PropVar v); void Commit();
              }
              public static class Aumid {
                [DllImport("shell32.dll")] static extern int SHGetPropertyStoreForWindow(IntPtr hwnd, ref Guid iid, [MarshalAs(UnmanagedType.Interface)] out IPropertyStore store);
                [DllImport("shell32.dll", CharSet = CharSet.Unicode)] static extern int SHGetPropertyStoreFromParsingName(string path, IntPtr bc, int flags, ref Guid iid, [MarshalAs(UnmanagedType.Interface)] out IPropertyStore store);
                public static string Of(IntPtr hwnd) {
                  Guid iid = typeof(IPropertyStore).GUID; IPropertyStore store;
                  if (SHGetPropertyStoreForWindow(hwnd, ref iid, out store) != 0) return null;
                  return Read(store);
                }
                public static string OfFile(string path) {
                  Guid iid = typeof(IPropertyStore).GUID; IPropertyStore store;
                  if (SHGetPropertyStoreFromParsingName(path, IntPtr.Zero, 0, ref iid, out store) != 0) return null;
                  return Read(store);
                }
                static string Read(IPropertyStore store) {
                  PropKey key = new PropKey { fmtid = new Guid("9F4C2855-9F79-4B39-A8D0-E1D42DE1D5F3"), pid = 5 };
                  PropVar v; store.GetValue(ref key, out v); Marshal.ReleaseComObject(store);
                  return (v.vt == 31 || v.vt == 8) ? Marshal.PtrToStringUni(v.p) : null;
                }
              }
            }'
          # Alerts are sent as the app the Start menu knows; without that ID on its entry they
          # came from "Windows PowerShell". Beside "Skykeep", each app's own entry
          # (packaging/windows/installer-hooks.nsh): "Skykeep Notes" opens Notes on its own, under
          # that app's own ID — the one its window says (taskbar.rs), so it gets a taskbar button
          # of its own. Each shortcut file first, as written; then the Start menu's list.
          $apps = [ordered]@{ Notes = "notes"; Reminders = "reminders"; Calendar = "calendar"; Contacts = "contacts"; Drive = "drive"; Photos = "photos" }
          $entries = [ordered]@{ "Skykeep" = @("io.github.yashwanthkamireddi.Skykeep", "") }
          foreach ($name in $apps.Keys) { $entries["Skykeep $name"] = @("io.github.yashwanthkamireddi.Skykeep.$name", "--app $($apps[$name])") }
          $shell = New-Object -ComObject WScript.Shell
          $programs = [Environment]::GetFolderPath("Programs")
          foreach ($name in $entries.Keys) {
            $path = "$programs\$name.lnk"
            if (-not (Test-Path $path)) { throw "no '$name' shortcut; the Start menu folder has: $((Get-ChildItem $programs -Filter *.lnk).Name -join ', ')" }
            $lnk = $shell.CreateShortcut($path)
            $id = [WinShell.Aumid]::OfFile($path)
            "shortcut: $name -> $($lnk.TargetPath) $($lnk.Arguments) [$id]"
            if ($lnk.TargetPath -ne $exe.FullName -or $lnk.Arguments -ne $entries[$name][1]) { throw "'$name' runs '$($lnk.TargetPath) $($lnk.Arguments)'" }
            if ($id -ne $entries[$name][0]) { throw "the '$name' shortcut has app ID '$id', not $($entries[$name][0])" }
          }
          # The Start menu takes a moment to list shortcuts just written.
          $wrong = @()
          for ($i = 0; $i -lt 30; $i++) {
            $listed = @(Get-StartApps | Where-Object { $_.Name -like "Skykeep*" })
            $wrong = @($entries.Keys | Where-Object { $n = $_; -not ($listed | Where-Object { $_.Name -eq $n -and $_.AppID -eq $entries[$n][0] }) })
            if (-not $wrong) { break }
            Start-Sleep -Seconds 2
          }
          if ($wrong) { $listed | Format-Table -AutoSize | Out-String | Write-Host; throw "the Start menu does not list, with its own app ID: $($wrong -join ', ')" }
          "start menu: $($listed.Count) entries, each with its own app ID"
          # Every visible top-level window the process owns, by title. MainWindowTitle names only
          # one of them, and that may be the hidden single-instance window ("…-siw").
          Add-Type -Namespace Win -Name U -MemberDefinition '
            public delegate bool EnumProc(System.IntPtr h, System.IntPtr l);
            [System.Runtime.InteropServices.DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc f, System.IntPtr l);
            [System.Runtime.InteropServices.DllImport("user32.dll")] public static extern bool IsWindowVisible(System.IntPtr h);
            [System.Runtime.InteropServices.DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(System.IntPtr h, out uint pid);
            [System.Runtime.InteropServices.DllImport("user32.dll", CharSet = System.Runtime.InteropServices.CharSet.Unicode)] public static extern int GetWindowText(System.IntPtr h, System.Text.StringBuilder s, int n);
          '
          function Get-Titles([int]$procId) {
            $found = New-Object System.Collections.Generic.List[string]
            [Win.U]::EnumWindows({ param($h, $l)
              $owner = 0; [void][Win.U]::GetWindowThreadProcessId($h, [ref]$owner)
              if ($owner -eq $procId -and [Win.U]::IsWindowVisible($h)) {
                $sb = New-Object System.Text.StringBuilder 256; [void][Win.U]::GetWindowText($h, $sb, 256); $found.Add($sb.ToString())
              }
              $true }, [System.IntPtr]::Zero) | Out-Null
            $found
          }
          function Find-Window([int]$procId, [string]$title) {
            $found = New-Object System.Collections.Generic.List[System.IntPtr]
            [Win.U]::EnumWindows({ param($h, $l)
              $owner = 0; [void][Win.U]::GetWindowThreadProcessId($h, [ref]$owner)
              if ($owner -eq $procId -and [Win.U]::IsWindowVisible($h)) {
                $sb = New-Object System.Text.StringBuilder 256; [void][Win.U]::GetWindowText($h, $sb, 256)
                if ($sb.ToString() -eq $title) { $found.Add($h) }
              }
              $true }, [System.IntPtr]::Zero) | Out-Null
            $found | Select-Object -First 1
          }
          $p = Start-Process $exe.FullName -PassThru
          $titles = @()
          for ($i = 0; $i -lt 30 -and -not ($titles -contains "Skykeep"); $i++) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { throw "Skykeep exited on start (code $($p.ExitCode))" }
            $titles = @(Get-Titles $p.Id)
          }
          if (-not ($titles -contains "Skykeep")) { throw "no Skykeep window after 60 s (visible: '$($titles -join "', '")')" }
          "window up: Skykeep"
          Start-Sleep -Seconds 6
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\skykeep-on-windows.png")
          if ($p.HasExited) { throw "Skykeep closed by itself" }
          # Launched as its Start-menu entry and its jump-list task launch it — a second Skykeep,
          # handing its command line to the one running — each app's window is its own, under
          # its own app ID. `--new event` is Calendar's window with an event started.
          foreach ($launch in @(@("--app notes", "Notes"), @("--new event", "Calendar"))) {
            Start-Process $exe.FullName -ArgumentList $launch[0]
            $h = $null
            for ($i = 0; $i -lt 15 -and -not $h; $i++) { Start-Sleep -Seconds 2; $h = Find-Window $p.Id $launch[1] }
            if (-not $h) { throw "skykeep $($launch[0]): no $($launch[1]) window after 30 s (visible: '$((Get-Titles $p.Id) -join "', '")')" }
            $id = [WinShell.Aumid]::Of($h)
            $want = "io.github.yashwanthkamireddi.Skykeep.$($launch[1])"
            if ($id -ne $want) { throw "the $($launch[1]) window has app ID '$id', not $want" }
            "skykeep $($launch[0]): $($launch[1]) window, app ID $id"
          }
          # The jump list, written by Skykeep as it starts: every task's command line is in one of
          # the lists the shell keeps (UTF-16 inside a binary file, so matched byte for byte).
          $latin = [System.Text.Encoding]::GetEncoding(28591)
          $lists = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Recent\CustomDestinations" -Filter *.customDestinations-ms -ErrorAction SilentlyContinue |
            ForEach-Object { $latin.GetString([System.IO.File]::ReadAllBytes($_.FullName)) }
          if (-not $lists) { throw "no jump list was written" }
          $tasks = @("--new note", "--new reminder", "--new event") + ($apps.Values | ForEach-Object { "--app $_" })
          foreach ($task in $tasks) {
            $needle = $latin.GetString([System.Text.Encoding]::Unicode.GetBytes($task))
            if (-not ($lists | Where-Object { $_.Contains($needle) })) { throw "the jump list has no '$task' task" }
          }
          "jump list: $($tasks -join ', ')"
          Stop-Process -Id $p.Id
          Start-Sleep -Seconds 2
          # Uninstalled, every entry goes with it. The uninstaller hands itself to a copy and
          # returns at once, so the Start menu is watched rather than the process waited on.
          Start-Process (Join-Path $exe.DirectoryName "uninstall.exe") -ArgumentList "/S" -Wait
          $left = @()
          for ($i = 0; $i -lt 30; $i++) {
            $left = @(Get-ChildItem $programs -Filter "Skykeep*.lnk" -ErrorAction SilentlyContinue)
            if (-not $left -and -not (Test-Path $exe.FullName)) { break }
            Start-Sleep -Seconds 1
          }
          if ($left) { throw "uninstalled, but the Start menu still has: $($left.Name -join ', ')" }
          if (Test-Path $exe.FullName) { throw "uninstalled, but skykeep.exe is still there" }
          "uninstalled: no Skykeep entries left in the Start menu"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: skykeep-on-windows
          path: skykeep-on-windows.png
          if-no-files-found: ignore
