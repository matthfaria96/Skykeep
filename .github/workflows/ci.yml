# Every push and pull request to main, on Linux only (the repository is private, and Actions
# minutes on it are counted):
#   rust — cargo fmt, clippy with warnings as errors, and the real tests (libraries, the app
#          and test files; the probe examples are live tools, not tests);
#   web  — npm ci, the type check, the production build, the model tests, and a smoke run of
#          the key interface suites in Chromium against `vite preview`.
# The two run side by side. A newer push to the same branch or pull request cancels the older
# run. Windows is proven by windows.yml, by hand or by a release. A branch can be run by hand
# (Actions → CI → Run workflow) before it goes to main.
name: CI

on:
  workflow_dispatch:
  # A change to the words or pictures alone (README, docs) builds nothing: it skipped no check
  # that could fail, and every README edit cancelled the run before it. Secrets in any commit are
  # still refused by the pre-commit guard, and the release runs every check whatever changed.
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/media/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/media/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debug info in CI builds: smaller cache, faster links, same checks.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # What the repository publishes: only paths .github/published-paths names (a broad `git add`
  # once published another app's installer and every local note), and no secret in any commit.
  published:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Nothing stray is tracked
        run: |
          stray=$(git ls-files | grep -vxE -f <(grep -vE '^(#|$)' .github/published-paths) || true)
          if [ -n "$stray" ]; then
            echo "::error::Tracked but not meant to be published (add to .github/published-paths only if it is):"
            echo "$stray"
            exit 1
          fi
      - name: No secret in any commit
        env:
          GITLEAKS: "8.30.1"
        run: |
          curl -fsSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS}/gitleaks_${GITLEAKS}_linux_x64.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS}/gitleaks_${GITLEAKS}_checksums.txt" \
            | grep " gitleaks_${GITLEAKS}_linux_x64.tar.gz$" | sed 's/ .*/  gl.tgz/' | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          ./gitleaks git --no-banner --redact .

  # On x86_64 and on 64-bit ARM: Apple Silicon Macs run Linux (Asahi, Omarchy) on aarch64.
  rust:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50  # a cold cache (new toolchain, new lockfile) compiles everything; warm runs take ~12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsecret-1-dev libheif-dev libheif-plugin-libde265 libfuse3-dev pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
          # The codecs, not only their headers: a video test reads an .mp4's first frames, and
          # Copy's test decodes a HEIC (libde265, which the .deb depends on too).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main writes the cache; pull requests read it, so they cannot crowd it out.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # The window's files must exist for the app crate to compile (tauri::generate_context!).
      - run: npm ci --no-audit --no-fund
      # The installer build refuses a Tauri npm package and Rust crate on different minor
      # versions; caught here in seconds rather than at the end of a Windows build.
      - name: Tauri versions match
        run: |
          node -e '
            const lock = require("./package-lock.json").packages;
            const npm = lock["node_modules/@tauri-apps/api"].version;
            const rust = require("fs").readFileSync("Cargo.lock", "utf8").match(/name = "tauri"\nversion = "([^"]+)"/)[1];
            const mm = (v) => v.split(".").slice(0, 2).join(".");
            console.log(`@tauri-apps/api ${npm}, tauri crate ${rust}`);
            if (mm(npm) !== mm(rust)) { console.error("Tauri npm package and crate differ: align them"); process.exit(1); }'
      - run: npx vite build
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --lib --bins --tests --locked --no-fail-fast
      # The keyring code against a real, throwaway gnome-keyring on a private bus (check.sh's
      # "real keyring"): what the keyring crate saved reads with ours, and a burst is survived.
      - name: A real keyring
        if: runner.arch == 'X64'
        run: |
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus-daemon
          t=$(mktemp -d); mkdir -p "$t/data" "$t/run"; chmod 700 "$t/run"
          XDG_DATA_HOME="$t/data" XDG_RUNTIME_DIR="$t/run" dbus-run-session -- bash -c '
            echo -n throwaway | gnome-keyring-daemon --unlock --components=secrets >/dev/null 2>&1
            export QUINCE_ISOLATED_KEYRING=$DBUS_SESSION_BUS_ADDRESS
            cargo test --locked -p quince-auth --lib secret_service -- --ignored'
      # A download onto a disk that really fills up (a 1 MB tmpfs): the disk's own refusal,
      # not a made-up free-space number, stops it cleanly (folder_download/tests.rs).
      - name: A real full disk
        run: |
          sudo mkdir -p /mnt/skykeep-full
          sudo mount -t tmpfs -o size=1m,uid=$(id -u) tmpfs /mnt/skykeep-full
          SKYKEEP_FULL_DISK=/mnt/skykeep-full cargo test --locked -p quince-app real_full_disk -- --ignored

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25  # the interface suites grew past 15 minutes; a warm run takes ~16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vite build
      - name: Model tests
        run: node --test .uiverify/*.test.mjs
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw.outputs.version }}
      - name: Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Interface smoke, in Chromium
        env:
          ENGINE: chromium
        run: |
          shots="$RUNNER_TEMP/shots"; mkdir -p "$shots"
          export TMPDIR="$shots"
          # The preview server, on every address so "localhost" answers as 127.0.0.1 or ::1.
          node node_modules/vite/bin/vite.js preview --port 4173 --strictPort --host >"$shots/preview.log" 2>&1 &
          preview=$!
          up=
          for _ in $(seq 60); do
            if ! kill -0 "$preview" 2>/dev/null; then break; fi
            if curl -sf -o /dev/null http://localhost:4173/; then up=1; break; fi
            sleep 0.5
          done
          if [ -z "$up" ]; then
            cat "$shots/preview.log"
            echo "::error::the preview server did not come up on :4173"
            exit 1
          fi
          echo "preview up"
          # The key flows, one or two per app: the window's security policy, accessibility,
          # sign-out, and an instant write in each app.
          suites="csp a11y boundary signout notes-compose notes-instant reminders-add-done
                  reminders-instant calendar-edits contacts-select drive-nav photos settings
                  search-everything updates device-approval"
          failed=()
          for t in $suites; do
            if node ".uiverify/$t.mjs" >"$shots/$t.log" 2>&1; then
              echo "ok   $t"
            else
              echo "FAIL $t"; failed+=("$t"); sed 's/^/    /' "$shots/$t.log" | tail -40
            fi
          done
          kill "$preview" 2>/dev/null || true
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::${#failed[@]} suite(s) failed: ${failed[*]}"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ui-smoke
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          retention-days: 7
