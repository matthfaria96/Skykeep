[package]
name = "quince-app"
version = "0.1.14"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
quince-vfs = { path = "../crates/quince-vfs" }
sha2 = "0.10"
# The tray is Tauri's on Windows and macOS. On Linux it is ksni's (main.rs, linux_tray): Tauri's
# goes through libayatana-appindicator, which never passes a click on, so a left click could
# only ever open the menu.
tauri = { version = "2", features = ["image-png"] }
quince-auth = { path = "../crates/quince-auth" }
quince-core = { path = "../crates/quince-core" }
quince-media = { workspace = true }
quince-icloud = { path = "../crates/quince-icloud" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# "sync": a folder download hands files from the reading to the fetching through a bounded
# queue (folder_download.rs).
tokio = { workspace = true, features = ["signal", "sync"] }
anyhow.workspace = true
jiff = "0.2.37"
uuid.workspace = true
base64 = "0.22"
tauri-plugin-dialog = "2.7.3"
# The one dialog shown before the window can be: a library that will not open.
rfd = { version = "0.16", default-features = false }
tauri-plugin-opener = "2"
notify-rust = "4"
tauri-plugin-single-instance = "2"
libc = "0.2"
tauri-plugin-window-state = "2"
# Skykeep's own updates (updates.rs), from GitHub Releases. Held to one minor version: its HTTP
# client is handed to quince_auth::releases to be locked, and the plugin may move to another
# reqwest in a minor release. Without its "zip" feature: releases are built with
# createUpdaterArtifacts true, so the installers and the AppImage are the update themselves, never
# a .zip or .tar.gz to unpack — and the zip crate it pulled in had a critical advisory.
tauri-plugin-updater = { version = "~2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
semver = "1"
# A merged card's picture made small enough for Apple (contacts_merge.rs): the same build of
# the crate quince-media already uses, so nothing new is compiled.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Names from a Mac saved composed (NFC), and compared so, in a folder download (folder_download.rs):
# the build reqwest's URL parsing already compiles, through idna, so nothing new is built.
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }

# Toasts with buttons on Windows (notify-rust sends none there): the same crate notify-rust uses.
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
# The asynchronous operations the windows crate's WinRT calls answer with (hello.rs waits on
# Windows Hello's): the same 0.3 the windows crate itself is built on.
windows-future = "0.3"
# Each app its own taskbar button and the jump list's tasks (taskbar.rs), and whether this copy
# is an MSIX package's (package.rs) and its startup task (login.rs): the shell's own calls,
# from the same build of the crate Tauri and the toasts already compile.
windows = { version = "0.62", features = [
    "ApplicationModel",
    "Win32_Foundation",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    # What a launch WebView2 cannot draw says, and its repair (startup_guard.rs).
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com_Urlmon",
    # Windows Hello for the Hidden album (hello.rs): the consent verifier, owned by our window.
    "Foundation",
    "Security_Credentials_UI",
    "Win32_System_WinRT",
] }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18", default-features = false }
# What the window's player can decode here (video.rs), asked of GStreamer, which WebKitGTK
# plays through. The poster reader is quince-media's (poster.rs).
gstreamer = "0.25"
zbus = "5"
# The tray, spoken as StatusNotifierItem over D-Bus itself: a left click (Activate) opens the
# window. async-io, as zbus here runs on, not a second D-Bus runtime.
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }
# Each app's window says its own app ID on Wayland (apps.rs): the GTK window under Tauri's.
gtk = "0.18"
gdk = "0.18"
glib = "0.18"
# The web views' memory cache sized for an app, not a browser (main.rs, app_cache): the same
# build wry already compiles, so nothing new is built.
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }

[dev-dependencies]
tempfile = "3"
# A stand-in for Apple's contacts service, for sending a merge twice (contacts_merge.rs).
wiremock = "0.6"
