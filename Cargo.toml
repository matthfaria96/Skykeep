[workspace]
resolver = "2"
members = ["probe", "macos/bridge", "crates/quince-auth", "crates/quince-core", "crates/quince-icloud", "crates/quince-media", "crates/quince-vfs", "src-tauri"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "cookies", "gzip", "rustls-tls", "stream", "multipart"], default-features = false }
serde = { version = "1", features = ["derive"] }
# Numbers read back exactly as written: Apple's records carry long decimals (Reminders' section
# timestamps), and a save that re-wrote them a few digits off would change other records.
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
quince-media = { path = "crates/quince-media" }

# Debug builds without the full debug symbols of every dependency. Those symbols were most of
# a forty-gigabyte target directory — each probe and test is its own binary, and the app alone
# came to three hundred megabytes a copy — and nobody steps through webkit2gtk in a debugger.
# Line tables are kept for this project's own code, so a panic still names the line it came from.
[profile.dev]
debug = "line-tables-only"
# The app he runs every day is this build: unoptimised, every picture served, every reply
# parsed and every database read ran many times slower than it needs to. Our own code a
# little optimised (still quick to rebuild), everything it stands on fully.
opt-level = 1

[profile.dev.package."*"]
debug = false
opt-level = 3

# What people install. Measured on the release binary (2026-10-22): the defaults left 16
# codegen units per crate and no cross-crate inlining, and shipped the symbol table — about a
# fifth of the binary, mapped into memory with it.
# - opt-level 3: photos are decoded, resized and hashed in this process; size-tuned code
#   ("s"/"z") is slower exactly there.
# - lto "thin" + one codegen unit: inlining across crates (serde, rusqlite, image, reqwest)
#   at a fraction of fat LTO's link time and memory, which on a small CI machine is the
#   difference between a build and an out-of-memory kill.
# - strip: no symbol table on disk or in memory; a panic still says where in its message.
# - panic stays "unwind": the library rolls a half-applied change back when one panics
#   (quince-core `atomically` catches the unwind), and a command that panics fails alone
#   instead of taking the app and its open windows down. "abort" would undo both.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
