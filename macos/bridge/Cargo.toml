[package]
name = "skykeep-cloud"
version = "1.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Skykeep for Mac's iCloud bridge: signs in to iCloud and reads and writes Notes over CloudKit, for the Swift app."

[[bin]]
name = "skykeep-cloud"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "net"] }
quince-auth = { path = "../../crates/quince-auth" }
quince-core = { path = "../../crates/quince-core" }
quince-icloud = { path = "../../crates/quince-icloud" }
# Mail, the way every mail app reaches iCloud Mail: IMAP (imap.mail.me.com) to read, flag and
# delete, SMTP (smtp.mail.me.com) to send, with an app-specific password kept in the keychain.
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }
mail-parser = "0.10"
futures-util = "0.3"
keyring = { version = "3", default-features = false, features = ["apple-native"] }
base64 = "0.22"
