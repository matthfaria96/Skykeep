[package]
name = "quince-icloud"
version = "0.1.14"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
quince-core = { path = "../quince-core" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
jiff = "0.2.37"
plist = "1.10"
base64 = "0.22"
flate2 = "1"
uuid = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "time", "net"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha1 = "0.10"
# Locked notes (notes_locked.rs): PBKDF2-SHA256 → AES key unwrap (RFC 3394) → AES-GCM.
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
aes = "0.8"
aes-kw = "0.2"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
# The live push channel (courier.rs): Apple's web push socket, its P-256 signed connect.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
tokio = { workspace = true }
wiremock = "0.6"
