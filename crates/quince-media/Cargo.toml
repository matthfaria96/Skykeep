[package]
name = "quince-media"
version = "0.1.14"
edition.workspace = true
license.workspace = true

[dependencies]
fast_image_resize = "6.1.0"
# Only the formats Apple has been observed to serve. Every extra decoder is compile time and
# attack surface for no gain.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.17"

# HEIC decoded with libheif: the system's on Linux, and on Windows one built in by vcpkg
# (`libheif[core,libde265]`, decoding only; see the Windows workflow) — not Windows' own
# decoder, which needs two Store extensions most machines do not have. Left out only of the
# MinGW cross-check, which has no vcpkg.
[target.'cfg(not(all(windows, target_env = "gnu")))'.dependencies]
# Only what libheif 1.17 has, the oldest in the distributions Skykeep ships for (Ubuntu 24.04);
# the crate's default asks for 1.23, which none of their packages carry yet.
libheif-rs = { version = "3.0.0", default-features = false, features = ["v1_17"] }

# A video's poster when Apple's is blank (poster.rs): one frame read with GStreamer, which
# WebKitGTK already needs, so nothing new is installed. Linux only: elsewhere Apple's poster
# stands.
[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"

[dev-dependencies]
tempfile = "3"
