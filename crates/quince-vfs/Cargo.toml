[package]
name = "quince-vfs"
version = "0.1.14"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
quince-core = { path = "../quince-core" }
tokio = { workspace = true, features = ["sync", "rt", "time"] }
libc = "0.2"
quince-media = { path = "../quince-media" }
md-5 = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18", default-features = false }

# iCloud Drive in File Explorer (cloud.rs): the Cloud Files API and the shell's registration.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Storage",
    "Storage_Provider",
    "Storage_Search",
    "Win32_Foundation",
    "Win32_Storage_CloudFilters",
    "Win32_Storage_FileSystem",
    "Win32_System_CorrelationVector",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }
windows-future = "0.3"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tempfile = "3"
libc = "0.2"
tokio = { workspace = true, features = ["sync", "rt", "macros", "rt-multi-thread"] }
